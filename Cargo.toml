[workspace]
members = ["src/rystemdb-core", "src/rystemdb-cli", "src/rystemdb-storage", "src/rystemdb-protocol", "src/libraries/rust/rystemdb-client"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/KeyserDSoze/RystemDatabase"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
