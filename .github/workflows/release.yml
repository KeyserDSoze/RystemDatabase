name: Native and container release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify new version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./npm/cli/package.json').version")"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag and npm version differ" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; not republishing immutable assets."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable GitHub Actions dependencies (#67)
        run: |
          python3 scripts/check_workflow_action_pins.py --self-test
          python3 scripts/check_workflow_action_pins.py
      - run: cargo test --workspace --locked --all-targets
      - name: Run process-crash regression suite
        run: cargo test -p rystemdb-storage --locked --features fault-injection --tests -- --test-threads=1
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: npm/cli
      - name: Ensure release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./npm/cli/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
  binaries:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rystemdb-linux-x64
            ext: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: rystemdb-linux-arm64
            ext: ''
          - os: macos-15
            target: x86_64-apple-darwin
            asset: rystemdb-darwin-x64
            ext: ''
          - os: macos-15
            target: aarch64-apple-darwin
            asset: rystemdb-darwin-arm64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rystemdb-windows-x64.exe
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Run tests for native targets
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build native executable
        shell: bash
        run: |
          cargo build --release --locked -p rystemdb-cli --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rystemdb${{ matrix.ext }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  github-release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum rystemdb-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --prerelease
  npm-publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: npm tests
        run: npm test
        working-directory: npm/cli
      - name: Publish npm package if token configured and name reserved
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        working-directory: npm/cli
      - name: Explain missing npm credentials
        if: env.NPM_TOKEN == ''
        run: echo "Skipped npm publish; configure NPM_TOKEN and verify ownership of the rystemdb npm name."
  container:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/keyserdsoze/rystemdatabase:${{ needs.prepare.outputs.tag }}

  install-smoke:
    # Re-test immutable already-published assets on each main push, too.
    if: always() && needs.prepare.result == 'success' && (needs.github-release.result == 'success' || needs.prepare.outputs.publish == 'false')
    needs: [prepare, github-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install released native binary and exercise CLI (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RYSTEMDB_VERSION: ${{ needs.prepare.outputs.tag }}
          RYSTEMDB_INSTALL_DIR: ${{ runner.temp }}/rystemdb-bin
        shell: bash
        run: |
          bash scripts/install.sh
          bin="$RYSTEMDB_INSTALL_DIR/rystemdb"
          test "$("$bin" --version)" = "rystemdb ${RYSTEMDB_VERSION#v}"
          data="$(mktemp -d)"
          trap 'rm -rf "$data"' EXIT
          printf '{"name":"Ada"}' | "$bin" document put --data "$data" --collection users --id u42 --json -
          result="$("$bin" document get --data "$data" --collection users --id u42)"
          test "$result" = '{"name":"Ada"}'
          "$bin" document delete --data "$data" --collection users --id u42
          if "$bin" document get --data "$data" --collection users --id u42; then
            echo "deleted document still available" >&2
            exit 1
          fi
      - name: Install released native binary and exercise CLI (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.tag }}
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'rystemdb-bin'
          & ./scripts/install.ps1 -Version $env:VERSION_TAG -InstallDir $installDir
          $bin = Join-Path $installDir 'rystemdb.exe'
          $actualVersion = & $bin --version
          if ($actualVersion -ne ('rystemdb ' + $env:VERSION_TAG.TrimStart('v'))) {
            throw "Wrong installed Rystem version: $actualVersion"
          }
          $data = Join-Path $env:RUNNER_TEMP 'rystemdb-data'
          '{"name":"Ada"}' | & $bin document put --data $data --collection users --id u42 --json -
          if ($LASTEXITCODE -ne 0) { throw 'put failed' }
          $found = & $bin document get --data $data --collection users --id u42
          if ($LASTEXITCODE -ne 0 -or $found -ne '{"name":"Ada"}') {
            throw "Windows get failed: $found"
          }
          & $bin document delete --data $data --collection users --id u42
          if ($LASTEXITCODE -ne 0) { throw 'delete failed' }
          # Negative GET is expected: capture it without leaving PowerShell's
          # special native exit status set to failure for the whole Actions step.
          $PSNativeCommandUseErrorActionPreference = $false
          & $bin document get --data $data --collection users --id u42
          $missingExitCode = $LASTEXITCODE
          if ($missingExitCode -eq 0) { throw 'Deleted document was still found' }
          $global:LASTEXITCODE = 0
          Write-Host "Expected not-found response verified on Windows."
