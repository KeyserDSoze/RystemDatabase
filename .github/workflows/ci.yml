name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust test + lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust version
        run: rustc --version
      - name: Check workspace and unit/integration tests
        run: cargo test --workspace --locked --all-targets
      - name: Storage failure and process-crash recovery matrix (feature-gated)
        run: cargo test -p rystemdb-storage --locked --features fault-injection --tests -- --test-threads=1
      - name: Clippy (default production features)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Clippy (test fault-injection enabled)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release --locked -p rystemdb-cli
  npm:
    name: npm installer + TypeScript live RPC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native installer npm tests
        if: runner.os == 'Linux'
        run: npm test
        working-directory: npm/cli
      - name: Build actual native Rust server for Node interop
        run: cargo build --locked -p rystemdb-cli
      - name: TypeScript RSWP cross-language wire and live RPC contract
        run: npm test
        working-directory: src/libraries/typescript/rystemdb-client
        env:
          RYSTEMDB_BINARY: ${{ github.workspace }}/target/debug/rystemdb${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Validate native installer npm package
        if: runner.os == 'Linux'
        run: npm pack --dry-run
        working-directory: npm/cli
  dotnet:
    name: .NET typed SDK + live Rust RPC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual native Rust server for C# interop
        run: cargo build --locked -p rystemdb-cli
      - name: .NET protocol and live RPC conformance
        shell: bash
        env:
          RYSTEMDB_BINARY: ${{ github.workspace }}/target/debug/rystemdb${{ runner.os == 'Windows' && '.exe' || '' }}
        run: dotnet run --project src/libraries/dotnet/RystemDatabase.Client.Tests/RystemDatabase.Client.Tests.csproj --configuration Release -- "$RYSTEMDB_BINARY"
      - name: Build EF Core library scaffold
        run: dotnet build src/libraries/dotnet/RystemDatabase.EntityFrameworkCore/RystemDatabase.EntityFrameworkCore.csproj --configuration Release

  docker:
    name: Docker build + basic smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t rystemdb:ci .
      - name: Verify container executable
        run: docker run --rm rystemdb:ci --version
      - name: Smoke-test live HTTP readiness
        shell: bash
        run: |
          cid="$(docker run -d -p 127.0.0.1:18787:8787 rystemdb:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18787/healthz | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
      - name: Verify documents persist across separate Docker invocations
        shell: bash
        run: |
          volume="rystem-ci-${GITHUB_RUN_ID}"
          docker volume create "$volume" >/dev/null
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          printf '{"name":"Ada"}' | docker run --rm -i -v "$volume:/data" rystemdb:ci \
            document put --data /data --collection users --id u42 --json -
          found="$(docker run --rm -v "$volume:/data" rystemdb:ci \
            document get --data /data --collection users --id u42)"
          test "$found" = '{"name":"Ada"}'
