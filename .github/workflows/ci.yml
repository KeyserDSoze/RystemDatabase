name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust test + lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust version
        run: rustc --version
      - name: Bootstrap JSON crate lockfile (temporary; will be committed)
        shell: bash
        run: |
          cargo generate-lockfile
          echo 'BEGIN GENERATED LOCKFILE'
          cat Cargo.lock
          echo 'END GENERATED LOCKFILE'
      - name: Check workspace and unit/integration tests
        run: cargo test --workspace --locked --all-targets
      - name: Storage failure and process-crash recovery matrix (feature-gated)
        run: cargo test -p rystemdb-storage --locked --features fault-injection --tests -- --test-threads=1
      - name: Clippy (default production features)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Clippy (test fault-injection enabled)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release --locked -p rystemdb-cli
  npm:
    name: npm wrapper contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: npm/cli
      - name: Validate npm package
        run: npm pack --dry-run
        working-directory: npm/cli
  docker:
    name: Docker build + basic smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t rystemdb:ci .
      - name: Verify container executable
        run: docker run --rm rystemdb:ci --version
      - name: Smoke-test live HTTP readiness
        shell: bash
        run: |
          cid="$(docker run -d -p 127.0.0.1:18787:8787 rystemdb:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18787/healthz | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
