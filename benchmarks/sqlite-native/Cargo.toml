[package]
name = "rystemdb-bench-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Isolated research-only native SQLite comparator; NOT a production Rystem dependency"

# Its own workspace prevents importing rusqlite and C SQLite into the
# production top-level workspace and locked cross-platform builds.
[workspace]
resolver = "2"

[dependencies]
rystemdb-core = { path = "../../src/rystemdb-core" }
rystemdb-storage = { path = "../../src/rystemdb-storage" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "=1.0.154"
