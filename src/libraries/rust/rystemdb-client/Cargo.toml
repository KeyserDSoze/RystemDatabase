[package]
name = "rystemdb-client"
description = "Experimental Rust client for Rystem Database wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
rystemdb-protocol = { path = "../../../rystemdb-protocol" }
rystemdb-core = { path = "../../../rystemdb-core" }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
