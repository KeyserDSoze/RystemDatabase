[package]
name = "rystemdb-cli"
description = "Rystem Database native document CLI and experimental health-only network server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rystemdb"
path = "src/main.rs"

[dependencies]
rystemdb-core = { path = "../rystemdb-core" }
rystemdb-storage = { path = "../rystemdb-storage" }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
